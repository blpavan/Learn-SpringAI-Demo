version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: techdesk-redis
    ports:
      - "6379:6379"
    restart: unless-stopped         # no volume — RAM is the point ✅

volumes:
  ollama_data: