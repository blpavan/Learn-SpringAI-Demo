version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: techdesk-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: knowledge-desk-mongo-rag
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: NewPassword123
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"                  # REST API + Web UI Dashboard
      - "6334:6334"                  # gRPC — Spring AI connects here
    restart: unless-stopped
